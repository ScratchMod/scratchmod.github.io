<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="shortcut icon" href="favicon.ico?" type="image/x-icon"></link>
        <link rel="stylesheet" href="index.css" />
        <title>Scratch Mods</title>
        <style>
            body {
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Scratch Mods</h1>
            <button id="switch-theme">Switch Theme</button>
        </header>
        <div id="gap" style="height: 18px;">
            <a href="https://scratchmod.github.io/credits" target="_blank">Visit the credits page here</a>
        </div>
        <div id="tree-wrapper">
            <div id="tree-container">
                <svg id="connections">
                    <g id="connections-group"></g>
                </svg>
            </div>
            <div id="tree-settings-container">
                <div id="tree-settings">
                    <p>Coordinates:</p>
                    <div class="upper-coords-inputs">
                        <div class="lower-coords-input">
                            <p>x: </p>
                            <input id="x" type="number">
                        </div>
                        <div class="lower-coords-input">
                            <p>y: </p>
                            <input id="y" type="number">
                        </div>
                    </div>
                    <hr>
                    <p>Zooming:</p>
                    <div class="zoom-options">
                        <div class="zoom-buttons">
                            <button id="out">
                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="34.6" height="34.6" viewBox="0,0,34.6,34.6">
                                    <g transform="translate(-222.7,-162.7)">
                                        <g stroke-miterlimit="10">
                                            <path d="M222.7,197.3v-34.6h34.6v34.6z" fill-opacity="0.00392" fill="#9966ff" stroke="none" stroke-width="NaN" stroke-linecap="butt"></path>
                                            <path d="M249.1521,180.57334c0,0.77679 -0.62971,1.4065 -1.4065,1.4065h-15.4912c-0.77679,0 -1.4065,-0.62971 -1.4065,-1.4065v-1.14668c0,-0.77679 0.62971,-1.4065 1.4065,-1.4065h15.4912c0.77679,0 1.4065,0.62971 1.4065,1.4065z" fill="#808080" stroke="none" stroke-width="0" stroke-linecap="butt"></path>
                                            <path d="M227.1497,180c0,-7.09702 5.75327,-12.8503 12.8503,-12.8503c7.09702,0 12.8503,5.75327 12.8503,12.8503c0,7.09702 -5.75327,12.8503 -12.8503,12.8503c-7.09702,0 -12.8503,-5.75327 -12.8503,-12.8503z" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="butt"></path>
                                            <path d="M252.64875,194.05036l-4.23837,-4.23837" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"></path>
                                        </g>
                                    </g>
                                </svg>
                            </button>
                            <button id="reset">
                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="34.6" height="34.6" viewBox="0,0,34.6,34.6">
                                    <g transform="translate(-222.7,-162.7)">
                                        <g stroke="none" stroke-miterlimit="10">
                                            <path d="M222.7,197.3v-34.6h34.6v34.6z" fill-opacity="0.00392" fill="#9966ff" stroke-width="NaN"></path>
                                            <path d="M251.61579,186.08305c0,0.9859 -0.79923,1.78513 -1.78513,1.78513h-19.66132c-0.9859,0 -1.78513,-0.79923 -1.78513,-1.78513v-1.45535c0,-0.9859 0.79923,-1.78513 1.78513,-1.78513h19.66132c0.9859,0 1.78513,0.79923 1.78513,1.78513z" fill="#808080" stroke-width="0"></path>
                                            <path d="M251.61579,175.37231c0,0.9859 -0.79923,1.78513 -1.78513,1.78513h-19.66132c-0.9859,0 -1.78513,-0.79923 -1.78513,-1.78513v-1.45535c0,-0.9859 0.79923,-1.78513 1.78513,-1.78513h19.66132c0.9859,0 1.78513,0.79923 1.78513,1.78513z" fill="#808080" stroke-width="0"></path>
                                        </g>
                                    </g>
                                </svg>
                            </button>
                            <button id="in">
                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="34.6" height="34.6" viewBox="0,0,34.6,34.6">
                                    <g transform="translate(-222.7,-162.7)">
                                        <g stroke-miterlimit="10">
                                            <path d="M222.7,197.3v-34.6h34.6v34.6z" fill-opacity="0.00392" fill="#9966ff" stroke="none" stroke-width="NaN" stroke-linecap="butt"></path>
                                            <path d="M239.42666,189.1521c-0.77679,0 -1.4065,-0.62971 -1.4065,-1.4065v-15.4912c0,-0.77679 0.62971,-1.4065 1.4065,-1.4065h1.14668c0.77679,0 1.4065,0.62971 1.4065,1.4065v15.4912c0,0.77679 -0.62971,1.4065 -1.4065,1.4065z" fill="#808080" stroke="none" stroke-width="0" stroke-linecap="butt"></path>
                                            <path d="M249.1521,180.57334c0,0.77679 -0.62971,1.4065 -1.4065,1.4065h-15.4912c-0.77679,0 -1.4065,-0.62971 -1.4065,-1.4065v-1.14668c0,-0.77679 0.62971,-1.4065 1.4065,-1.4065h15.4912c0.77679,0 1.4065,0.62971 1.4065,1.4065z" fill="#808080" stroke="none" stroke-width="0" stroke-linecap="butt"></path>
                                            <path d="M227.1497,180c0,-7.09702 5.75327,-12.8503 12.8503,-12.8503c7.09702,0 12.8503,5.75327 12.8503,12.8503c0,7.09702 -5.75327,12.8503 -12.8503,12.8503c-7.09702,0 -12.8503,-5.75327 -12.8503,-12.8503z" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="butt"></path>
                                            <path d="M252.64875,194.05036l-4.23837,-4.23837" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"></path>
                                        </g>
                                    </g>
                                </svg>
                            </button>
                        </div>
                        <div class="zoom-input">
                            <p>%: </p>
                            <input id="zoom" type="number">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="src/index.js"></script>
    </body>
</html>
